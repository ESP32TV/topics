name: Learning series — topic suggestion
description: Propose a topic for an ESP32TV Learning episode. Reviewed against the topic policy.
labels: ["triage", "series: learning"]
body:
  - type: markdown
    attributes:
      value: |
        Make the issue title your topic. One specific line beats a category —
        "ESP32-C6 Matter commissioning, end to end" clears the bar, "networking stuff" does not.

        Accepted topics become episodes, so describing what you need to see makes the episode answer
        your actual question. Full policy: [README](https://github.com/ESP32TV/topics/blob/main/README.md#topic-policy).

        This form is for the **Learning** series only. For Insider, Tech Review, Project Review,
        ESP32 Youth, Expert View, Monthly News, Breaking News, Book Review, Hardware or the Job market,
        use the other form.

  - type: textarea
    id: coverage
    attributes:
      label: What should the episode cover?
      description: Two to six concrete points. Becomes the episode outline if the topic is approved.
      placeholder: |
        - Commission a C6 into Thread from the ESP-IDF CLI, no vendor app
        - Border router on a second board, and what breaks when it dies
    validations:
      required: true

  - type: textarea
    id: why
    attributes:
      label: Why does this matter to ESP32 developers?
      description: Optional. Who runs into this, and what is missing or misleading in what already exists.
    validations:
      required: false

  - type: dropdown
    id: layer
    attributes:
      label: Where does it sit in the stack?
      options:
        - Toolchain and build (ESP-IDF, Arduino, PlatformIO, flashing, CI)
        - Protocols and networking (Wi-Fi, BLE, Thread, Matter, MQTT, ESP-NOW)
        - Firmware architecture and RTOS (tasks, scheduling, memory, performance)
        - Debugging and diagnosis (logs, backtraces, JTAG, core dumps)
        - Configuration, storage and boot (sdkconfig, partitions, NVS, filesystems, startup)
        - Peripherals and drivers (I2C, SPI, USB, ADC, sensors)
        - Low power, OTA and reliability (sleep, watchdog, updates, provisioning)
        - AI-assisted development (agent workflow, prompting, reviewing generated code)
        - AI and edge inference (TFLite, LLMs, vision, voice)
        - Security (secure boot, flash encryption, TLS, credentials)
        - Ecosystem and tooling around ESP32 (clients, dashboards, integrations)
        - Other
    validations:
      required: true

  - type: textarea
    id: references
    attributes:
      label: References
      description: Optional. Links are checked — a broken link delays review, one that contradicts the topic gets it declined as unsupported.
      placeholder: |
        https://docs.espressif.com/...
        https://github.com/...
    validations:
      required: false

  - type: checkboxes
    id: confirmations
    attributes:
      label: Before you submit
      description: All four must hold. Reviewers check them at triage, and a "no" at triage is what gets a topic declined.
      options:
        - label: I searched open and closed issues — this topic is not already requested.
        - label: This is about ESP32 development, not general electronics, and not a request for direct support.
        - label: Every link in References resolves, and none of them contradicts the topic.
        - label: This is not promotional and carries no vendor marketing.
    validations:
      required: true
